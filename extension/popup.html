<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ilusion</title>
  <link rel="stylesheet" href="src/styles/popup.css">
</head>
<body>
  
  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2-1 4-2 7-2 2.5 0 4.5 1 6 2a1 1 0 0 1 1 1v7z"></path></svg>
      </div>
      <span class="brand-name">ilusion<span>.io</span></span>
    </div>
    <a href="https://ilusion.io/dashboard" target="_blank" class="nav-link">Dashboard ↗</a>
  </header>

  <!-- Tabs -->
  <div class="tabs-container">
    <button id="tab-compose" class="tab-btn active">Compose</button>
    <button id="tab-reveal" class="tab-btn">Reveal</button>
  </div>

  <!-- Main Content -->
  <main>
    
    <!-- COMPOSE VIEW -->
    <div id="view-compose">
      <div class="form-group">
        <label class="label-title">Message</label>
        <textarea id="compose-content" placeholder="Type your secret message..."></textarea>
      </div>

      <div class="form-group">
        <label class="label-title">Self-Destruct</label>
        <select id="compose-expiry">
          <option value="1">1 hour</option>
          <option value="24" selected>24 hours (1 day)</option>
          <option value="168">168 hours (7 days)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="label-title">Custom Alias (Optional)</label>
        <input type="text" id="compose-alias" placeholder="e.g., my-api-token">
        <p class="input-note">⚠️ Note: Custom aliases are easier to guess and offer less brute-force protection than random IDs.</p>
      </div>

      <button id="btn-create" class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
        Generate Link
      </button>

      <!-- Success State -->
      <div id="compose-success" class="alert-card hidden">
        <p class="alert-title">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
          Secret Created
        </p>
        <div class="copy-container">
          <input type="text" id="compose-link" readonly class="copy-input">
          <button id="btn-copy" class="btn-copy">Copy</button>
        </div>
      </div>
    </div>

    <!-- REVEAL VIEW -->
    <div id="view-reveal" class="hidden">
      <!-- Sub-tabs for Reveal Mode -->
      <div class="reveal-modes">
        <button id="reveal-mode-link" class="mode-btn active">By Link</button>
        <button id="reveal-mode-alias" class="mode-btn">By Alias</button>
      </div>

      <!-- Mode Link Inputs -->
      <div id="reveal-panel-link" class="form-group">
        <label class="label-title">Secret Link</label>
        <input type="text" id="reveal-input-link" placeholder="https://ilusion.io/secret/xyz#key">
      </div>

      <!-- Mode Alias Inputs -->
      <div id="reveal-panel-alias" class="hidden" style="display: flex; flex-direction: column; gap: 12px;">
        <div class="form-group">
          <label class="label-title">Secret Alias</label>
          <div class="input-prefix-container">
            <span class="input-prefix">ilusion.io/secret/</span>
            <input type="text" id="reveal-input-alias" placeholder="my-custom-alias">
          </div>
        </div>
      </div>

      <button id="btn-reveal" class="btn btn-success">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        Reveal Secret
      </button>

      <!-- Reveal Result -->
      <div id="reveal-result" class="hidden" style="margin-top: 16px;">
        <div class="form-group" style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <span class="label-title" style="color: #10b981; margin: 0;">Decrypted Content</span>
          <button id="btn-copy-reveal" class="btn-copy">Copy</button>
        </div>
        <div class="decrypted-card">
          <p id="reveal-content" class="decrypted-text"></p>
        </div>
        <p class="info-footer">This secret has been burned and cannot be viewed again.</p>
      </div>

      <!-- Reveal Error -->
      <div id="reveal-error" class="error-card hidden">
        <p id="reveal-error-text" class="error-text"></p>
      </div>
    </div>

  </main>

  <script src="src/scripts/crypto.js"></script>
  <script src="src/scripts/popup.js"></script>
</body>
</html>
